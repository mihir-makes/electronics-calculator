<!DOCTYPE html>
<html lang="en">

<head>


<title>Electronics Calculator 01</title>

<link rel="stylesheet" href="style.css">

</head>

<body>

<div class="container">

    <header>

        <h1>Electronics Toolkit</h1>
        <p class="subtitle">Voltage Divider Calculator</p>

    </header>

    <div class="main-grid">

        <!-- LEFT SIDE -->

        <div class="card">

            <h2>Input Parameters</h2>

            <label>Input Voltage Vin (V)</label>
            <input id="vin" type="number" placeholder="">

            <label>Resistor R1</label>

            <div class="input-row">

                <input id="r1" type="number" placeholder="">

                <select id="r1unit">
                    <option value="1">Ω</option>
                    <option value="1000">kΩ</option>
                    <option value="1000000">MΩ</option>
                </select>

            </div>

            <label>Resistor R2</label>

            <div class="input-row">

                <input id="r2" type="number" placeholder="">

                <select id="r2unit">
                    <option value="1">Ω</option>
                    <option value="1000">kΩ</option>
                    <option value="1000000">MΩ</option>
                </select>

            </div>

            <hr>

            <label class="checkbox">

                <input type="checkbox" id="adcEnable">

                Calculate ADC Value

            </label>

            <div id="adcSection" style="display:none;">

                <label>MCU Vref (V)</label>

                <input id="vref" type="number" placeholder="">

                <label>ADC Resolution</label>

                <select id="bits">

                    <option value="8">8 Bit</option>
                    <option value="10">10 Bit</option>
                    <option value="12" selected>12 Bit</option>
                    <option value="14">14 Bit</option>
                    <option value="16">16 Bit</option>

                </select>

            </div>

            <button onclick="calculate()">

                Calculate

            </button>

        </div>

        <!-- RIGHT SIDE -->

        <div class="card">

            <h2>Results</h2>

            <div class="result-box">

                <div class="result-item">

                    <span>Voltage Divider Output</span>

                    <h3 id="voutText">-- V</h3>

                </div>

                <div class="result-item">

                    <span>ADC Count</span>

                    <h3 id="adcText">--</h3>

                </div>

                <div class="result-item">

                    <span>Status</span>

                    <h3 id="warning">Waiting for Calculation</h3>

                </div>

            </div>

        </div>

    </div>

</div>

<script src="script.js"></script>

</body>

</html>
